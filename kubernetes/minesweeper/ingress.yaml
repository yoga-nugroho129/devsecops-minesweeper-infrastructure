apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: minesweeper
  namespace: minesweeper

spec:
  ingressClassName: traefik

  rules:
    - host: minesweeper.cycylearninglab.com
      http:
        paths:
          - path: '/'
            pathType: Prefix
            backend:
              service:
                name: minesweeper
                port:
                  number: 80
