apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: minesweeper
  namespace: minesweeper

spec:
  ingressClassName: traefik

  rules:
    - host: minesweeper.local
      http:
        - paths:
            - pathType: Prefix
              path: '/'
              backend:
                service:
                  name: minesweeper
                  port:
                    number: 80
