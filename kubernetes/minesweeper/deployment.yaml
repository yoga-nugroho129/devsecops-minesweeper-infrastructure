apiVersion: apps/v1
kind: Deployment

metadata:
  name: minesweeper
  namespace: minesweeper
  labels:
    app: minesweeper

spec:
  replicas: 2

  selector:
    matchLabels:
      app: minesweeper

  template:
    metadata:
      labels:
        app: minesweeper

    spec:
      containers:
        - name: minesweeper
          image: docker.io/yoganugroho129/devsecops-minesweeper:12
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
