apiVersion: v1
kind: Deployment

metadata:
  name: minesweeper
  namespace: minesweeper
  labels:
    app: minesweeper

spec:
  replicas: 2

  selector:
    matchLabels:
      app: minesweeper

  template:
    metadata:
      labels:
        app: minesweeper

    spec:
      container:
        - name: minesweeper
          image: docker.io/yoganugroho129/devsecops-minesweeper:12
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP
